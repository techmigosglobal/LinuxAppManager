name: vin-linux-app-manager
base: core24
version: '0.1.2'
summary: Inspect installed Linux applications and package sources
description: |
  VIN-LinuxManager inventories desktop applications and installed packages from
  supported Linux software sources, displays provider health and duplicate
  installations, and records local history. This Snap edition is read-only:
  host removal and cleanup operations are disabled. Use native packages for
  reviewed host package changes. Classic confinement requires store approval.
icon: packaging/io.github.techmigosglobal.LinuxAppManager.png
grade: stable
confinement: classic
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

parts:
  # Produced from the tested Ubuntu 24.04 portable runtime by pack-snap.sh.
  # Do not build from a native launcher containing host-absolute /usr paths.
  application:
    plugin: dump
    source: dist/snap-appdir
    build-attributes: [enable-patchelf]

apps:
  vin-linux-app-manager:
    command: AppRun
    desktop: io.github.techmigosglobal.LinuxAppManager.desktop
