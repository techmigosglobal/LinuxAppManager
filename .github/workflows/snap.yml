name: Snap build and validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'snap/**'
      - 'packaging/appimage/**'
      - 'scripts/*snap*'
      - 'scripts/build-appimage.sh'
      - '.github/workflows/snap.yml'

permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Install bundled runtime and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config python3 python3-yaml python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 libgdk-pixbuf2.0-bin libglib2.0-bin adwaita-icon-theme hicolor-icon-theme shared-mime-info desktop-file-utils appstream curl squashfs-tools zsync xvfb dbus-x11 patchelf
          sudo snap install core24
      - name: Build exact-commit portable runtime
        run: |
          version=$(python3 scripts/check-release-version.py)
          ./scripts/build-source.sh --local dist/source
          mkdir runtime-source
          tar -xzf "dist/source/linux-app-manager-$version.tar.gz" -C runtime-source
          ./scripts/build-appimage.sh "runtime-source/linux-app-manager-$version" dist/runtime
      - name: Pack and test the Snap runtime
        run: |
          version=$(python3 scripts/check-release-version.py)
          ./scripts/pack-snap.sh "dist/runtime/VIN-LinuxManager-$version-x86_64.AppImage" \
            "dist/runtime/VIN-LinuxManager-$version-x86_64.AppImage.build.json" "$GITHUB_SHA" dist/snap
      - name: Install and test through snapd
        run: |
          sudo snap install --dangerous --classic dist/snap/*.snap
          snap run vin-linux-app-manager --cli list --all --json > dist/snap/installed-inventory.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('dist/snap/installed-inventory.json').read_text())
          assert inventory['apps'], 'installed Snap did not inventory the host'
          print(f"Installed Snap inventoried {len(inventory['apps'])} packages")
          PY
          if snap run vin-linux-app-manager --cli uninstall release-smoke --yes > dist/snap/installed-mutation.log 2>&1; then
            echo 'Installed Snap unexpectedly permitted host changes' >&2
            exit 1
          fi
          grep -q 'disabled in sandboxed builds' dist/snap/installed-mutation.log
          xvfb-run -a dbus-run-session -- snap run vin-linux-app-manager --appimage-smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: vin-linux-app-manager-snap
          path: dist/snap/*
          if-no-files-found: error
