name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without the leading v (for example 0.1.0)'
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install GUI and package validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream desktop-file-utils python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb
      - name: Format
        run: cargo fmt --all -- --check
      - name: Tests
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: GUI integration smoke
        run: ./scripts/test-integration.sh
      - name: Release audit
        run: ./scripts/release-audit.sh

  deb:
    name: Build Debian package
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cargo rustc debhelper-compat dpkg-dev python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Build package
        run: |
          rustc --version
          cargo --version
          dpkg-buildpackage -d -us -uc -b
      - name: Collect package
        run: |
          mkdir -p dist/deb
          cp ../linux-app-manager_*.deb dist/deb/
      - uses: actions/upload-artifact@v4
        with:
          name: vin-linuxmanager-deb
          path: dist/deb/*.deb

  source:
    name: Build source bundle
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          mkdir -p dist/source
          git archive --format=tar.gz --prefix=vin-linuxmanager-${GITHUB_REF_NAME#v}/ HEAD > dist/source/vin-linuxmanager-${GITHUB_REF_NAME#v}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vin-linuxmanager-source
          path: dist/source/*.tar.gz

  publish:
    name: Publish GitHub release
    needs: [deb, source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten release artifacts
        run: |
          mkdir -p release
          find dist -type f -exec cp {} release/ \;
      - name: Sign release artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          for required_secret in GPG_PRIVATE_KEY GPG_PASSPHRASE GPG_KEY_ID; do
            if [[ -z "${!required_secret}" ]]; then
              echo "missing required release secret: ${required_secret}" >&2
              exit 1
            fi
          done

          export GNUPGHOME="$RUNNER_TEMP/vin-linuxmanager-gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --with-colons --list-secret-keys "$GPG_KEY_ID" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [[ -z "$fingerprint" ]]; then
            echo "GPG_KEY_ID does not resolve to a secret key" >&2
            exit 1
          fi

          gpg --armor --export "$fingerprint" > release/vin-linuxmanager-release-public-key.asc
          printf '%s\n' "$fingerprint" > release/vin-linuxmanager-release-key-fingerprint.txt
          chmod 0644 release/vin-linuxmanager-release-public-key.asc \
            release/vin-linuxmanager-release-key-fingerprint.txt

          mapfile -t release_inputs < <(
            find release -maxdepth 1 -type f \
              ! -name 'SHA256SUMS' \
              ! -name '*.asc' \
              -print | sort
          )
          sha256sum "${release_inputs[@]}" > release/SHA256SUMS
          printf '%s' "$GPG_PASSPHRASE" > "$RUNNER_TEMP/gpg-passphrase"
          chmod 600 "$RUNNER_TEMP/gpg-passphrase"
          GPG_PASSPHRASE_FILE="$RUNNER_TEMP/gpg-passphrase" \
            ./scripts/sign-release.sh "$GPG_KEY_ID" release
          ./scripts/verify-release-signatures.sh \
            release/vin-linuxmanager-release-public-key.asc release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "VIN-LinuxManager ${GITHUB_REF_NAME}" \
            --generate-notes
