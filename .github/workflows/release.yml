name: Release artifacts

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing immutable release tag version, without v'
        required: true
        default: '0.1.1'
        type: string
      preflight:
        description: 'Build current workflow commit for validation only; never create a release'
        required: true
        default: true
        type: boolean
      build_appimage:
        description: 'Include the optional AppImage after its extraction/launch checks'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: '1.90.0'

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
      preflight: ${{ steps.identity.outputs.preflight }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight && github.sha || github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          persist-credentials: false
      - name: Require an existing tag with synchronized metadata
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PREFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then tag="v$REQUESTED_VERSION"; fi
          if [[ "$PREFLIGHT" == true ]]; then
            version="$(python3 scripts/check-release-version.py --version "$REQUESTED_VERSION")"
          else
            version="$(python3 scripts/check-release-version.py --tag "$tag")"
          fi
          printf 'tag=%s\nversion=%s\ncommit=%s\npreflight=%s\n' "$tag" "$version" "$(git rev-parse HEAD)" "$PREFLIGHT" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install release validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep rpm apt-utils appstream desktop-file-utils patchelf python3-yaml python3-pil gpgv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb gnupg
      - name: Format, Rust tests and Clippy
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: GUI integration smoke
        run: ./scripts/test-integration.sh
      - name: Release audit
        run: ./scripts/release-audit.sh

  source:
    name: Vendor immutable source
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Create reproducible offline source archive
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PREFLIGHT: ${{ needs.verify.outputs.preflight }}
        run: |
          if [[ "$PREFLIGHT" == true ]]; then
            ./scripts/build-source.sh --local dist/source
          else
            ./scripts/build-source.sh "$RELEASE_TAG" dist/source
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-manager-source
          path: dist/source/*
          if-no-files-found: error

  native:
    name: Build ${{ matrix.target }} x86_64
    needs: [verify, source]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu24.04
            image: ubuntu:24.04
            family: deb
          - target: ubuntu26.04
            image: ubuntu:26.04
            family: deb
          - target: debian13
            image: debian:13
            family: deb
          - target: fedora43
            image: fedora:43
            family: rpm
          - target: fedora44
            image: fedora:44
            family: rpm
          - target: arch
            image: archlinux:base-devel
            family: arch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-manager-source
          path: source
      - name: Build and audit in matching distribution
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_IMAGE: ${{ matrix.image }}
          BUILD_FAMILY: ${{ matrix.family }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/native
          docker pull "$BUILD_IMAGE"
          docker image inspect "$BUILD_IMAGE" > "dist/native/$BUILD_TARGET-builder-image.json"
          toolchain_root="$(rustc --print sysroot)"
          docker run --rm --network bridge \
            -v "$PWD:/workspace:ro" -v "$PWD/dist/native:/output" \
            -v "$toolchain_root:/opt/rust:ro" -w /workspace \
            -e "BUILD_TARGET=$BUILD_TARGET" -e "BUILD_FAMILY=$BUILD_FAMILY" \
            -e "RELEASE_VERSION=$RELEASE_VERSION" -e LAM_RUST_TOOLCHAIN_ROOT=/opt/rust \
            -e PATH=/opt/rust/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            "$BUILD_IMAGE" bash -euxo pipefail -c '
              if [[ "$BUILD_FAMILY" == deb ]]; then
                apt-get update
                DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config debhelper-compat dpkg-dev python3 python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 pkexec desktop-file-utils appstream lintian
              elif [[ "$BUILD_FAMILY" == rpm ]]; then
                dnf install -y rpm-build rpmdevtools gcc glibc-devel cargo rust elfutils python3 python3-gobject gtk4 libadwaita polkit desktop-file-utils appstream rpmlint
              else
                pacman -Syu --noconfirm --needed base-devel rust python python-gobject gtk4 libadwaita polkit desktop-file-utils appstream namcap git
              fi
              rustc --version
              cargo --version
              ./scripts/build-native.sh "$BUILD_TARGET" "source/linux-app-manager-$RELEASE_VERSION.tar.gz" /output
            '
      - name: Install, launch and remove in a fresh runtime-only container
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --network bridge \
            -v "$PWD:/workspace:ro" -v "$PWD/dist/native:/packages:ro" \
            -e LAM_DISPOSABLE_BUILDER=1 "$BUILD_IMAGE" \
            bash /workspace/scripts/smoke-native.sh "$BUILD_TARGET" /packages \
            2>&1 | tee "dist/native/$BUILD_TARGET-install-smoke.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-manager-${{ matrix.target }}
          path: dist/native/*
          if-no-files-found: error

  apt_repository:
    name: Verify signed APT repository installation
    needs: [verify, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-app-manager-*
          path: artifacts
      - name: Compose test-signed repository from actual distro packages
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils appstream python3-pil gnupg
          mkdir -p "$RUNNER_TEMP/packages" apt-install-evidence
          for suite in ubuntu24.04 ubuntu26.04 debian13; do
            mkdir -p "$RUNNER_TEMP/packages/$suite"
            find artifacts -type f -name "linux-app-manager_*${suite}*_amd64.deb" \
              -exec cp {} "$RUNNER_TEMP/packages/$suite/" \;
          done
          export GNUPGHOME="$RUNNER_TEMP/apt-test-key"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent || true; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Release preflight <preflight@invalid.local>' ed25519 sign 1d
          fingerprint=$(gpg --with-colons --list-secret-keys | awk -F: '$1=="fpr" {print $10; exit}')
          python3 scripts/build-apt-repository.py --packages "$RUNNER_TEMP/packages" \
            --output "$RUNNER_TEMP/apt-test-repository" --key-id "$fingerprint"
      - name: Install through APT on each target distribution
        run: |
          set -euo pipefail
          for suite in ubuntu24.04 ubuntu26.04 debian13; do
            case "$suite" in
              ubuntu24.04) image=ubuntu:24.04 ;;
              ubuntu26.04) image=ubuntu:26.04 ;;
              debian13) image=debian:13 ;;
            esac
            docker run --rm -e LAM_DISPOSABLE_BUILDER=1 \
              -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/apt-test-repository:/repository:ro" \
              "$image" bash /workspace/scripts/smoke-generated-apt.sh "$suite" /repository \
              2>&1 | tee "apt-install-evidence/$suite.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apt-install-evidence
          path: apt-install-evidence/
          if-no-files-found: ignore

  appimage:
    name: Optional AppImage build and smoke
    needs: [verify, source]
    if: github.event_name == 'push' || inputs.build_appimage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-manager-source
          path: source
      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config python3 python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-1 libadwaita-1-0 libgdk-pixbuf2.0-bin libglib2.0-bin adwaita-icon-theme hicolor-icon-theme shared-mime-info desktop-file-utils appstream curl squashfs-tools zsync xvfb dbus-x11 patchelf
      - name: Build and test extracted AppImage
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir -p appimage-source
          tar -xzf "source/linux-app-manager-$RELEASE_VERSION.tar.gz" -C appimage-source
          ./scripts/build-appimage.sh "appimage-source/linux-app-manager-$RELEASE_VERSION" dist/appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app-manager-appimage
          path: dist/appimage/*
          if-no-files-found: error

  publish:
    name: Sign and publish verified artifacts
    needs: [verify, source, native, apt_repository, appimage]
    if: >-
      always() && needs.verify.outputs.preflight != 'true' &&
      needs.verify.result == 'success' && needs.source.result == 'success' &&
      needs.native.result == 'success' &&
      needs.apt_repository.result == 'success' &&
      (needs.appimage.result == 'success' || needs.appimage.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Signing and validation scripts are required here, including manual dispatch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect artifacts without filename collisions
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          output = pathlib.Path('release')
          output.mkdir()
          for artifact in sorted(pathlib.Path('dist').rglob('*')):
              if artifact.is_file():
                  destination = output / artifact.name
                  if destination.exists():
                      raise SystemExit(f'duplicate release filename: {artifact.name}')
                  shutil.copy2(artifact, destination)
          for report in output.glob('*.AppImage.build.json'):
              import json
              if json.loads(report.read_text()).get('development_builder') is not False:
                  raise SystemExit('AppImage built with development override cannot be published')
          PY
          python3 scripts/github-release-assets.py prepare release
      - name: Sign and verify complete download directory
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          [[ -n "$GPG_PRIVATE_KEY" && -n "$GPG_KEY_ID" ]] || { echo 'release signing secrets are missing' >&2; exit 1; }
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/release-gnupg.XXXXXX")"
          passphrase_file="$(mktemp "$RUNNER_TEMP/release-passphrase.XXXXXX")"
          cleanup() {
            gpgconf --homedir "$GNUPGHOME" --kill all >/dev/null 2>&1 || true
            rm -rf -- "$GNUPGHOME"
            rm -f -- "$passphrase_file"
          }
          trap cleanup EXIT
          chmod 700 "$GNUPGHOME"
          chmod 600 "$passphrase_file"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint="$(gpg --with-colons --list-secret-keys "$GPG_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "$fingerprint" ]] || { echo 'signing fingerprint not found' >&2; exit 1; }
          gpg --armor --export "$fingerprint" > release/vin-linuxmanager-release-public-key.asc
          printf '%s\n' "$fingerprint" > release/vin-linuxmanager-release-key-fingerprint.txt
          ./scripts/write-release-manifest.sh release
          printf '%s' "$GPG_PASSPHRASE" > "$passphrase_file"
          GPG_PASSPHRASE_FILE="$passphrase_file" ./scripts/sign-release.sh "$fingerprint" release
          ./scripts/verify-release-signatures.sh release/vin-linuxmanager-release-public-key.asc release
      - name: Create signed release draft for installation acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          # Promotion follows clean desktop installation acceptance; this job never marks it stable.
          # An existing release is never silently overwritten or appended to.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'release already exists; use a new version' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/* --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "VIN-LinuxManager $RELEASE_TAG" --generate-notes --draft
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/hosted-release.json"
          python3 scripts/github-release-assets.py check-hosted release \
            --release-json "$RUNNER_TEMP/hosted-release.json"
