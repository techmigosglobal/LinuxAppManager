name: Signed release desktop VM acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to test without rebuilding
        required: true
        default: v0.1.2
        type: string
      target:
        description: Validate one corrected guest or the complete supported matrix
        required: true
        default: all
        type: choice
        options: [all, fedora, ubuntu24.04, ubuntu26.04, debian13, fedora43, fedora44, arch]

permissions:
  contents: read

concurrency:
  group: desktop-acceptance-${{ inputs.tag }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop VM ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # GitHub exposes drafts only to callers with repository write access.
    # This job only downloads releases; it never edits or publishes one.
    permissions:
      contents: write
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["ubuntu24.04","ubuntu26.04","debian13","fedora43","fedora44","arch"]' || inputs.target == 'fedora' && '["fedora43","fedora44"]' || format('["{0}"]', inputs.target)) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install VM host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client gnupg
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
      - name: Download and verify existing signed release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json apiUrl --jq .apiUrl > "$RUNNER_TEMP/release-api-url"
          gh api "$(cat "$RUNNER_TEMP/release-api-url")" > "$RUNNER_TEMP/hosted.json"
          if jq -e .draft "$RUNNER_TEMP/hosted.json" >/dev/null; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release"
            echo 'Download origin: authenticated draft' > evidence/download-origin.txt
          else
            # No Authorization header is sent: prove anonymous public access.
            python3 - "$RUNNER_TEMP/hosted.json" "$RUNNER_TEMP/release" <<'PY'
          import json, pathlib, sys, urllib.request
          release = json.loads(pathlib.Path(sys.argv[1]).read_text())
          root = pathlib.Path(sys.argv[2])
          root.mkdir()
          for asset in release['assets']:
              name = asset['name']
              assert pathlib.Path(name).name == name and '\\' not in name
              url = asset['browser_download_url']
              assert url == f"https://github.com/techmigosglobal/LinuxAppManager/releases/download/{release['tag_name']}/{name}"
              with urllib.request.urlopen(url, timeout=120) as response, (root / name).open('wb') as output:
                  while block := response.read(1024 * 1024):
                      output.write(block)
          PY
            echo 'Download origin: anonymous public release URLs' > evidence/download-origin.txt
          fi
          ./scripts/verify-release-signatures.sh packaging/vin-linuxmanager-release-public-key.asc "$RUNNER_TEMP/release"
          python3 - "$RUNNER_TEMP/release/MANIFEST.json" "$RELEASE_TAG" <<'PY'
          import json, pathlib, subprocess, sys
          manifest = json.loads(pathlib.Path(sys.argv[1]).read_text())
          commit = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{sys.argv[2]}^{{commit}}'], text=True).strip()
          assert manifest['tag'] == sys.argv[2] and manifest['commit'] == commit
          assert manifest['version'] == sys.argv[2].removeprefix('v')
          PY
          python3 scripts/github-release-assets.py check-hosted "$RUNNER_TEMP/release" --release-json "$RUNNER_TEMP/hosted.json" --allow-public
          cp "$RUNNER_TEMP/release/MANIFEST.json" "$RUNNER_TEMP/release/SHA256SUMS" evidence/
      - name: Download and verify previous public DEB for upgrade acceptance
        if: startsWith(matrix.target, 'ubuntu') || matrix.target == 'debian13'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern '*.deb*' --dir "$RUNNER_TEMP/previous"
          export GNUPGHOME="$RUNNER_TEMP/previous-keyring"
          install -d -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import packaging/vin-linuxmanager-release-public-key.asc
          for package in "$RUNNER_TEMP/previous/"*.deb; do
            gpg --batch --verify "$package.asc" "$package"
          done
      - name: Exercise the installed release in a fresh desktop VM
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/run-acceptance-vm.py "$TARGET" "$RUNNER_TEMP/release" evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-vm-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error
