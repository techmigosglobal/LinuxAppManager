name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep rpm apt-utils appstream desktop-file-utils python3-pil gpgv gnupg xvfb python3-gi gir1.2-gtk-4.0 gir1.2-adw-1
      - name: Test
        run: cargo test --locked --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Release tooling tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Release metadata versions
        run: python3 scripts/check-release-version.py
      - name: Integration smoke
        run: ./scripts/test-integration.sh
      - name: Release audit
        run: ./scripts/release-audit.sh
      - name: Website audit
        run: ./scripts/verify-website.sh
